# Language Learning Bot — TLS-фронт перед BLS и web.
# 443 занят xray (VLESS REALITY) — не трогаем.
# Сертификат Let's Encrypt выписан на IP 77.81.226.56 (SAN: IP Address), домен не нужен.
#
# Копия в репозитории: deploy/langbot-tls.conf. Ставится в
# /etc/nginx/sites-available/langbot-tls.conf.

# Ограничение частоты для пишущих ручек. Настоящий клиент шлёт их редко: смена
# настройки — по нажатию, пачка офлайн-результатов — при возврате сети.
# 30 в минуту с запасом в 20 не заметит ни один человек, но остановит перебор.
limit_req_zone $binary_remote_addr zone=langbot_write:10m rate=30r/m;
limit_req_status 429;

# Формат с портом. Встроенный combined порт НЕ пишет, и по журналу нельзя было
# отличить заход на старый 8443 от нового 8543 — а это ровно то, что нужно
# знать, чтобы закрыть старые порты не наугад. У людей в настройках приложения
# адрес сохранён, и обновление APK переносит его только при первом запуске:
# пока хоть кто-то приходит на 8443, закрывать нельзя.
log_format langbot_port '$remote_addr - $remote_user [$time_local] '
                        'port=$server_port "$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

# ── BLS (внутренний 8531) ────────────────────────────────────────────────────
server {
    listen 8543 ssl http2;
    listen [::]:8543 ssl http2;
    # Старый 8443 снят 07.11.2026 вместе с правилом ufw. Переход подтверждён
    # не тишиной, а поимённо: deploy/old_ports_usage.sh показал обоих активных
    # пользователей на новых портах, последний заход второго на старый —
    # 31.10 19:57 против нового 07.11 13:19.

    ssl_certificate     /etc/x-ui/cert/fullchain.pem;
    ssl_certificate_key /etc/x-ui/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    access_log /var/log/nginx/langbot-bls.access.log langbot_port;
    error_log  /var/log/nginx/langbot-bls.error.log;

    # Админка снаружи не нужна никому: андроид к ней не обращается, а веб и
    # телеграм ходят в BLS с этой же машины, минуя nginx. Проверка прав в ней
    # верит присланному user_id, поэтому наружу её не выпускаем вовсе.
    # 404, а не 403: сканеру незачем знать, что путь существует.
    location ^~ /admin {
        return 404;
    }

    location ~ ^/(results/batch|settings/) {
        limit_req zone=langbot_write burst=20 nodelay;

        proxy_pass http://127.0.0.1:8531;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8531;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# ── Web frontend (внутренний 8548) ───────────────────────────────────────────
server {
    listen 8544 ssl http2;
    listen [::]:8544 ssl http2;
    # Старый 8444 снят 07.11.2026 вместе с правилом ufw — см. комментарий у
    # 8543. Живых клиентов на нём не было вовсе: веб-вход люди не открывали,
    # а всё, что туда приходило, оказалось сканерами.

    ssl_certificate     /etc/x-ui/cert/fullchain.pem;
    ssl_certificate_key /etc/x-ui/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    access_log /var/log/nginx/langbot-web.access.log langbot_port;
    error_log  /var/log/nginx/langbot-web.error.log;

    location / {
        proxy_pass http://127.0.0.1:8548;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
