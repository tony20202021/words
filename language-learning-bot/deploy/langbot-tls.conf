# Language Learning Bot — TLS-фронт перед BLS и web.
# 443 занят xray (VLESS REALITY) — не трогаем.
# Сертификат Let's Encrypt выписан на IP 77.81.226.56 (SAN: IP Address), домен не нужен.
#
# Копия в репозитории: deploy/langbot-tls.conf. Ставится в
# /etc/nginx/sites-available/langbot-tls.conf.

# Ограничение частоты для пишущих ручек. Настоящий клиент шлёт их редко: смена
# настройки — по нажатию, пачка офлайн-результатов — при возврате сети.
# 30 в минуту с запасом в 20 не заметит ни один человек, но остановит перебор.
limit_req_zone $binary_remote_addr zone=langbot_write:10m rate=30r/m;
limit_req_status 429;

# ── BLS (внутренний 8531) ────────────────────────────────────────────────────
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    ssl_certificate     /etc/x-ui/cert/fullchain.pem;
    ssl_certificate_key /etc/x-ui/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    access_log /var/log/nginx/langbot-bls.access.log;
    error_log  /var/log/nginx/langbot-bls.error.log;

    # Админка снаружи не нужна никому: андроид к ней не обращается, а веб и
    # телеграм ходят в BLS с этой же машины, минуя nginx. Проверка прав в ней
    # верит присланному user_id, поэтому наружу её не выпускаем вовсе.
    # 404, а не 403: сканеру незачем знать, что путь существует.
    location ^~ /admin {
        return 404;
    }

    location ~ ^/(results/batch|settings/) {
        limit_req zone=langbot_write burst=20 nodelay;

        proxy_pass http://127.0.0.1:8531;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8531;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# ── Web frontend (внутренний 8548) ───────────────────────────────────────────
server {
    listen 8444 ssl http2;
    listen [::]:8444 ssl http2;

    ssl_certificate     /etc/x-ui/cert/fullchain.pem;
    ssl_certificate_key /etc/x-ui/cert/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 64m;

    access_log /var/log/nginx/langbot-web.access.log;
    error_log  /var/log/nginx/langbot-web.error.log;

    location / {
        proxy_pass http://127.0.0.1:8548;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
