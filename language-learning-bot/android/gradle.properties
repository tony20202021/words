android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m

# Сервер боевой и маленький: 3,8 ГБ на всё, включая бота, BLS, бэкенд, веб и
# базу, которым вместе хватает ~0,85 ГБ. Демоны сборки после работы часами
# держали почти 1,9 ГБ — Gradle (жил 6 часов) и отдельная JVM компилятора Kotlin
# (ещё ~1 ГБ) — и загоняли машину в своп: 18.09 полный прогон тестов андроида
# шёл 4,5 часа вместо двух минут, а живые сервисы делили с ним память.
# Демон умирает через 10 минут простоя: в серии сборок он жив, потом память
# возвращается.
org.gradle.daemon.idletimeout=600000
# Kotlin компилирует внутри демона Gradle, а не отдельной JVM со своими 2 ГБ.
kotlin.compiler.execution.strategy=in-process
