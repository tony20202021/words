plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionFromPython = {
    def f = rootProject.file("../common/version.py")
    def m = (f.text =~ /__version__\s*=\s*["'](.+)["']/)
    m.find() ? m.group(1) : { throw new GradleException("version not found in common/version.py") }()
}()

def versionCodeFromName = { String v ->
    def p = v.split("\\.")
    p[0].toInteger() * 10000 + p[1].toInteger() * 100 + p[2].toInteger()
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.langbot.app'
    compileSdk 34

    signingConfigs {
        release {
            storeFile     keystoreProps['storeFile']     ? file(keystoreProps['storeFile'])     : null
            storePassword keystoreProps['storePassword'] ?: ""
            keyAlias      keystoreProps['keyAlias']      ?: ""
            keyPassword   keystoreProps['keyPassword']   ?: ""
        }
    }

    defaultConfig {
        applicationId "com.langbot.app"
        minSdk 26
        targetSdk 34
        // versionName и versionCode читаются из common/version.py
        // versionCode = major*10000 + minor*100 + patch  (e.g. 3.0.1 → 30001)
        versionName versionFromPython
        versionCode versionCodeFromName(versionFromPython)
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests {
            includeAndroidResources = true   // required by Robolectric
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Retrofit + OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Pull-to-refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Unit tests (pure JVM — no emulator needed; run via ./gradlew testReleaseUnitTest)
    testImplementation 'junit:junit:4.13.2'
    // Robolectric gives a real android.content.Context on the JVM, so the parts of
    // the offline layer that touch filesDir are testable without an emulator.
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    // MockWebServer — drive OutboxSync/BLS calls against a local stub server.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}
