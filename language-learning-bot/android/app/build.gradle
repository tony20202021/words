plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.langbot.app'
    compileSdk 34

    signingConfigs {
        release {
            storeFile     keystoreProps['storeFile']     ? file(keystoreProps['storeFile'])     : null
            storePassword keystoreProps['storePassword'] ?: ""
            keyAlias      keystoreProps['keyAlias']      ?: ""
            keyPassword   keystoreProps['keyPassword']   ?: ""
        }
    }

    defaultConfig {
        applicationId "com.langbot.app"
        minSdk 26
        targetSdk 34
        // versionName = project version (common/version.py) + patch для Android-изменений
        // versionCode = major*10000 + minor*100 + patch  (e.g. 3.0.1 → 30001)
        // ↑ инкрементировать patch при каждом изменении Android-кода
        versionCode 30021
        versionName "3.0.21"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Retrofit + OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Pull-to-refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
