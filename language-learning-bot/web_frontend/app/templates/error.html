{% extends "base.html" %}
{% block content %}
<div class="container py-5" style="max-width: 40rem;">
  <div class="card border-warning">
    <div class="card-body text-center">
      <h1 class="h4 mb-3">{{ title or "Что-то пошло не так" }}</h1>
      <p class="text-muted mb-4">{{ message }}</p>
      {% if detail %}
        <details class="text-start mb-4">
          <summary class="text-muted small">Подробности</summary>
          <pre class="small mt-2 mb-0" style="white-space: pre-wrap;">{{ detail }}</pre>
        </details>
      {% endif %}
      <div class="d-flex gap-2 justify-content-center">
        <a href="javascript:location.reload()" class="btn btn-primary">Повторить</a>
        <a href="/languages" class="btn btn-outline-secondary">К списку языков</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
