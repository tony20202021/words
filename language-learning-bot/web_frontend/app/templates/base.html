<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Language Learning{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    .word-foreign { font-size: 3rem; font-weight: bold; }
    .word-transcription { font-size: 1.6rem; color: #666; }
    .word-translation { font-size: 1.4rem; }
    .card-word { min-height: 220px; }
    .progress-bar-thin { height: 6px; }
    .btn-rate { min-width: 120px; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="/">📚 LangBot</a>
    <div class="ms-auto d-flex gap-2 align-items-center">
      {% if request.session.get('first_name') %}
        {% if request.session.get('is_admin') %}
          <a href="/admin" class="btn btn-outline-warning btn-sm">⚙ Админ</a>
        {% endif %}
        <a href="/stats" class="btn btn-outline-info btn-sm">📊 Статистика</a>
        <a href="/help" class="btn btn-outline-light btn-sm">? Помощь</a>
        <span class="text-light small">{{ request.session.get('first_name') }}</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Выйти</a>
      {% endif %}
    </div>
  </nav>
  <main class="container py-4" style="max-width:640px">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
